services:
  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./front-end:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: npm start -- --host 0.0.0.0

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./back-end:/app
      - dotnet_nuget:/root/.nuget/packages
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-app};Username=${POSTGRES_USER:-app};Password=${POSTGRES_PASSWORD:-app}"
    depends_on:
      - postgres
    command: dotnet watch --non-interactive run --urls http://0.0.0.0:8080

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: sleep infinity

volumes:
  frontend_node_modules:
  dotnet_nuget:
  postgres_data: